# TestFlight'a iOS IPA yükler (macos-latest runner — yerel Mac gerekmez).
#
# GitHub Secrets:
#   REVENUECAT_APPLE_API_KEY             RevenueCat iOS public SDK key
#   APP_STORE_CONNECT_ISSUER_ID          App Store Connect API Issuer ID
#   APP_STORE_CONNECT_API_KEY_ID         App Store Connect API Key ID
#   APP_STORE_CONNECT_API_KEY_BASE64     AuthKey_*.p8 (base64 veya PEM)
#   APPLE_TEAM_ID                        Apple Developer Team ID (10 karakter)
#   BUILD_CERTIFICATE_BASE64             Apple Distribution .p12 (base64)
#   P12_PASSWORD                         .p12 parolası
#   BUILD_PROVISION_PROFILE_BASE64       App Store .mobileprovision (base64)
name: Deploy to TestFlight

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy_testflight:
    name: Build IPA and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== STEP: Select Xcode ==="
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Set up Java (Zulu JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Flutter / iOS dependencies
        run: |
          echo "=== STEP: flutter pub get ==="
          flutter pub get
          flutter precache --ios

      - name: Verify signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "=== STEP: Verify signing secrets ==="
          missing=0
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing or empty secret: $name"
              missing=1
            else
              val="${!name}"
              echo "Secret present: $name (length ${#val})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are empty. Job stopped before Flutter build."
            exit 1
          fi

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Prepare App Store Connect API key file
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "=== STEP: Prepare App Store Connect API key ==="
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR" "$HOME/private_keys" "$HOME/.private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          write_key() {
            if printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$APP_STORE_CONNECT_API_KEY_BASE64" > "$KEY_FILE"
              return 0
            fi
            if printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_FILE" 2>/dev/null && grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
              return 0
            fi
            if printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$KEY_FILE" 2>/dev/null && grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
              return 0
            fi
            if printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_FILE" 2>/dev/null && grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
              return 0
            fi
            return 1
          }

          if ! write_key; then
            echo "Could not decode APP_STORE_CONNECT_API_KEY_BASE64 into a PKCS8 .p8 key."
            exit 1
          fi

          chmod 600 "$KEY_FILE"
          cp "$KEY_FILE" "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          cp "$KEY_FILE" "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "Wrote App Store Connect API key (not printed)."

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "=== STEP: Install provisioning profile ==="
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_PATH="$RUNNER_TEMP/app.mobileprovision"

          decode_ok=0
          if printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH" 2>/dev/null && [ -s "$PP_PATH" ]; then
            decode_ok=1
          elif printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$PP_PATH" 2>/dev/null && [ -s "$PP_PATH" ]; then
            decode_ok=1
          elif printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -d > "$PP_PATH" 2>/dev/null && [ -s "$PP_PATH" ]; then
            decode_ok=1
          fi
          if [ "$decode_ok" -ne 1 ]; then
            echo "BUILD_PROVISION_PROFILE_BASE64 could not be decoded. Re-encode with: base64 -i profile.mobileprovision | pbcopy"
            exit 1
          fi

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          if [ -z "$UUID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "Provisioning profile UUID/name could not be read. The secret is probably not a .mobileprovision file."
            exit 1
          fi

          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed provisioning profile: $PROFILE_NAME ($UUID)"

          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.stopkoc.stopAiEhliyetKocu '${PROFILE_NAME}'" ios/ExportOptions.plist
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Manual\nCODE_SIGN_IDENTITY=Apple Distribution\nPROVISIONING_PROFILE_SPECIFIER=%s\n' \
            "$APPLE_TEAM_ID" "$PROFILE_NAME" >> ios/Flutter/Release.xcconfig

      - name: Build iOS IPA (release)
        run: |
          echo "=== STEP: flutter build ipa ==="
          echo "ExportOptions.plist:"
          plutil -p ios/ExportOptions.plist
          flutter build ipa --release \
            --dart-define=REVENUECAT_APPLE_API_KEY=${{ secrets.REVENUECAT_APPLE_API_KEY }} \
            --export-options-plist="$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      - name: Resolve IPA path
        id: ipa
        run: |
          echo "=== STEP: Resolve IPA path ==="
          IPA_PATH=""
          if [ -d build/ios/ipa ]; then
            IPA_PATH=$(find build/ios/ipa -name '*.ipa' -print -quit)
          fi
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "IPA not found under build/ios/ipa. Flutter build/export failed before producing an IPA."
            ls -la build/ios || true
            ls -la build/ios/ipa || true
            ls -la build/ios/archive || true
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          echo "=== STEP: Upload to TestFlight ==="
          if [ -z "${IPA_PATH:-}" ] || [ ! -f "$IPA_PATH" ]; then
            echo "IPA_PATH is missing; skipping upload."
            exit 1
          fi
          echo "Uploading $IPA_PATH"
          # Native Apple uploader: API key file is already in ~/.appstoreconnect/private_keys
          # (avoids node12 apple-actions and empty JWT private key via GITHUB_OUTPUT).
          if xcrun altool --help >/dev/null 2>&1; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          else
            xcrun iTMSTransporter -m upload \
              -assetFile "$IPA_PATH" \
              -apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
