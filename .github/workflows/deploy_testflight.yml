# TestFlight'a iOS IPA yükler (macos-latest runner — yerel Mac gerekmez).
#
# GitHub Secrets:
#   REVENUECAT_APPLE_API_KEY          RevenueCat iOS public SDK key
#   APPSTORE_ISSUER_ID                App Store Connect API Issuer ID
#   APPSTORE_API_KEY_ID               App Store Connect API Key ID
#   APPSTORE_API_PRIVATE_KEY          AuthKey_*.p8 içeriği (PKCS8)
#   APPLE_TEAM_ID                     Apple Developer Team ID (10 karakter)
#   BUILD_CERTIFICATE_BASE64          Apple Distribution .p12 (base64)
#   P12_PASSWORD                      .p12 parolası
name: Deploy to TestFlight

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy_testflight:
    name: Build IPA and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Zulu JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify signing certificate secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "BUILD_CERTIFICATE_BASE64 secret is empty. Encode the .p12 with: base64 -i cert.p12 | pbcopy"
            exit 1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "P12_PASSWORD secret is empty."
            exit 1
          fi

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Configure automatic signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID secret is required for App Store automatic signing."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions.plist
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Automatic\n' "$APPLE_TEAM_ID" >> ios/Flutter/Release.xcconfig

      - name: Build iOS IPA (release)
        run: >
          flutter build ipa --release
          --dart-define=REVENUECAT_APPLE_API_KEY=${{ secrets.REVENUECAT_APPLE_API_KEY }}
          --export-options-plist=ios/ExportOptions.plist

      - name: Resolve IPA path
        id: ipa
        run: |
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -print | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found under build/ios/ipa"
            ls -la build/ios/ipa || true
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
